<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Online - Nest Cafe</title>
  <link rel="stylesheet" href="../bootstrap-5.3.3-dist/css/bootstrap.css">
  <link rel="stylesheet" href="../fontawesome-free-6.7.2-web/css/all.css">
  <style>
    body {
      background-color: #2E1A14;
      color: #F8EDEB;
      font-family: 'Georgia', serif;
    }
    .card {
      background: #8B5E3B;
      color: #FDFEFE;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.3);
    }
    .menu-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }
    .navbar {
      background-color: #4A2C2A;
    }
    footer {
      background-color: #4A2C2A;
      color: white;
    }
    .btn-order {
      background-color: #E09F3E;
      color: black;
      font-weight: bold;
    }
    .btn-order:hover {
      background-color: #cf8a2e;
      color: white;
    }
  </style>
</head>

<body class="container-fluid">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Nest Cafe</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavOrder">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavOrder">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/programs/cafe.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/story.html">Our Story</a></li>
        <li class="nav-item"><a class="nav-link" href="/programs/menu.html">Menu</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Order Online</a></li>
        <li class="nav-item"><a class="nav-link" href="/programs/nav1.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Order Section -->
<section class="container my-5 pt-5">
  <h2 class="text-center mb-4">Order Online</h2>
  <div class="row">
    
    <!-- Product Card Example -->
    <div class="col-md-4 mb-4">
      <div class="card p-3 h-100">
        <img src="/images/cappuccino.jpg" alt="Cappuccino" class="menu-img">
        <div class="card-body">
          <h5 class="card-title">Cappuccino</h5>
          <p class="card-text">RS.200</p>
          <input type="number" class="form-control mb-2" min="1" value="1">
          <button class="btn btn-order w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-4">
      <div class="card p-3 h-100">
        <img src="/images/latte.webp" alt="Latte" class="menu-img">
        <div class="card-body">
          <h5 class="card-title">Latte</h5>
          <p class="card-text">RS.320</p>
          <input type="number" class="form-control mb-2" min="1" value="1">
          <button class="btn btn-order w-100">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 mb-4">
      <div class="card p-3 h-100">
        <img src="/images/mocha.webp" alt="Mocha" class="menu-img">
        <div class="card-body">
          <h5 class="card-title">Mocha</h5>
          <p class="card-text">RS.350</p>
          <input type="number" class="form-control mb-2" min="1" value="1">
          <button class="btn btn-order w-100">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Cart Summary -->
  <div class="mt-5 p-4 border rounded bg-light text-dark">
    <h4>Cart Summary</h4>
    <p>No items added yet.</p>
    <button class="btn btn-success mt-2">Proceed to Checkout</button>
  </div>

</section>

<!-- Footer -->
<footer class="text-center py-4">
  &copy; 2025 Nest Cafe. All Rights Reserved. <br>
  <a href="#"><i class="fab fa-facebook fa-lg mx-2"></i></a>
  <a href="#"><i class="fab fa-instagram fa-lg mx-2"></i></a>
  <a href="#"><i class="fab fa-twitter fa-lg mx-2"></i></a>
</footer>

<script src="../bootstrap-5.3.3-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
